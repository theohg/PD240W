name: Unit Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Host-side (native x86-64) unit tests for the hardware-free logic headers.
# This is a completely separate toolchain from the firmware build in ci.yml:
# no Pico SDK, no ARM cross-compiler — just a native C++20 compiler running the
# Snitch suite under AddressSanitizer + UndefinedBehaviorSanitizer.
# See test/README.md and notes/UNIT_TEST.md.

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The tested headers pull in the TPS26750 multiplatform driver's data
          # types (native branch), so its submodule must be present.
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential lcov

      - name: Configure
        run: cmake -G Ninja -B test/build -S test

      - name: Build
        run: cmake --build test/build

      - name: Run tests
        working-directory: test/build
        run: ctest --output-on-failure

      # Coverage is generated by the build (ENABLE_COVERAGE defaults ON). Publish
      # the per-file lcov table to the job summary so the coverage of each
      # extracted logic header is visible per PR. NOTE: this measures ONLY the
      # pure headers compiled into the host suite — it is deliberately not a
      # whole-firmware number (the hardware-coupled managers aren't measured), so
      # a high percentage here means "what we extracted is well tested", not
      # "the firmware is well tested".
      - name: Coverage summary
        working-directory: test/build
        run: |
          lcov --directory . --capture --output-file coverage.info \
               --ignore-errors mismatch,unsupported,format,gcov,source,empty
          lcov --remove coverage.info '*/test/*' '*/_deps/*' '/usr/*' \
               --ignore-errors unused,empty --output-file coverage_filtered.info
          {
            echo "## Host unit-test coverage — extracted logic headers only"
            echo ""
            echo "Scope: the pure, hardware-free headers compiled into the Snitch suite."
            echo "This is **not** whole-firmware coverage; the hardware-coupled managers"
            echo "(state machine, PD manager, display) are hardware-tested only."
            echo ""
            echo '```'
            lcov --list coverage_filtered.info
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Regression guard: fail the job if coverage of the *tested* headers drops
      # below a floor (catches an extracted header landing without tests, which
      # pulls the aggregate down). Not a quality claim about untested code.
      - name: Enforce coverage floor
        working-directory: test/build
        run: |
          pct=$(lcov --summary coverage_filtered.info 2>&1 \
                | grep -i 'lines' | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          echo "Line coverage of tested headers: ${pct}%"
          floor=90
          awk -v p="${pct:-0}" -v f="$floor" 'BEGIN {
            if (p + 0 < f + 0) { printf "FAIL: %.1f%% is below the %d%% floor for tested headers\n", p, f; exit 1 }
            printf "OK: %.1f%% >= %d%% floor\n", p, f
          }'
